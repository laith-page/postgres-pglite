[tools]
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.check]
description = "Validate workflow syntax, shell commands and own-runner routing"
run = ["bash -n .ci/install-deps.sh .ci/linux.sh", "shellcheck .ci/*.sh", "actionlint -no-color", "bun .ci/l3-routing.ts ."]

[tasks.setup-hooks]
description = "Enable repository push validation"
run = "git config core.hooksPath .githooks"
